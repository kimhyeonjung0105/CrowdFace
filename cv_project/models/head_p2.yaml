# 머리 탐지용 YOLO11n + P2 탐지층 (우리가 직접 수정한 구조)
# 원본: ultralytics/cfg/models/11/yolo11.yaml (AGPL-3.0)
#
# [왜 바꾸나]
#  CrowdHuman 머리의 30%가 16픽셀 미만으로 아주 작다.
#  원본은 P3(1/8), P4(1/16), P5(1/32) 세 해상도에서만 탐지한다.
#  → P3에서도 16픽셀 머리는 특징 지도 위 2칸밖에 안 돼 놓치기 쉽다.
#  → 백본 2번 층의 P2(1/4) 특징을 끌어와 더 촘촘한 해상도에서도 탐지하게 한다.
#
# [무엇이 바뀌나]
#  - nc: 80 → 1 (클래스 'head' 하나. Detect 층 출력이 새로 만들어짐)
#  - head 부분: P3 다음에 '업샘플 → P2와 합치기 → C3k2' 를 추가 (원본 대비 + 표시)
#               P2 결과를 다시 내려보내 P3·P4·P5 경로를 이어 붙임
#  - Detect: [P3, P4, P5] → [P2, P3, P4, P5] 네 곳에서 탐지
#  - backbone(0~10층)은 원본과 똑같음 → COCO 가중치를 그대로 옮겨 받음(전이학습)

nc: 1
scales:
  n: [0.50, 0.25, 1024]

# backbone: 원본과 동일
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  ← P2 특징 (여기서 끌어옴)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # 위에서 아래로 (큰 특징 → 작은 특징), 원본과 동일
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  # + 추가: P2까지 한 단계 더 내려감
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall) ← 새 탐지 위치

  # 아래에서 위로 다시 올라가며 합침 (P2 → P3 → P4 → P5)
  - [-1, 1, Conv, [128, 3, 2]] # 20  + 추가
  - [[-1, 16], 1, Concat, [1]] # 21  + 추가: cat P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 cat P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
